name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@git.tools.mia-platform.eu/clients/mia-platform/demo/demo-companies/digital-platform-c/external-pipeline/configurations.git"
          git push gitlab --prune '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
